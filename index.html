<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data:; connect-src https://tbbaztmtkcrzxnkkmtqv.supabase.co wss://tbbaztmtkcrzxnkkmtqv.supabase.co; base-uri 'none'; form-action 'none';">
<title>Мессенджер</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="auth" class="screen">
  <div class="card">
    <h1>Мессенджер</h1>
    <div class="auth-grid">
      <div>
        <h2>Вход по QR</h2>
        <div id="qr" class="qr"></div>
        <p id="qrStatus" class="hint" aria-live="polite">Загрузка QR…</p>
        <p id="qrTimerText" class="hint"></p>
        <button type="button" id="qrRetry" hidden>Обновить QR</button>
      </div>
      <form id="loginForm" novalidate>
        <h2 id="formTitle">Почта и пароль</h2>
        <label for="email">Почта</label>
        <input id="email" type="email" placeholder="name@example.com" autocomplete="username">
        <label for="password">Пароль</label>
        <input id="password" type="password" autocomplete="current-password">
        <p id="pwHint" class="hint small" hidden>Не меньше 10 символов</p>
        <label for="username" id="usernameLabel" hidden>Никнейм</label>
        <input id="username" pattern="[a-z0-9_]{3,32}" hidden>
        <p id="userHint" class="hint small" hidden>3–32 символа: латинские буквы a-z, цифры 0-9 и _</p>
        <button type="submit" id="loginBtn">Войти</button>
        <button type="button" id="toggleReg" class="link">Нет аккаунта? Регистрация</button>
        <p id="authMsg" class="hint"></p>
      </form>
    </div>
  </div>
</section>
<section id="app" class="screen" hidden>
  <aside>
    <header><b id="me"></b><button id="logout" class="link">Выйти</button></header>
    <div class="actions">
      <input id="findUser" placeholder="Никнейм (можно с @)">
      <button id="newDirect">Написать</button>
    </div>
    <ul id="chatList"></ul>
  </aside>
  <main>
    <header id="chatTitle">Выберите чат</header>
    <div id="messages"></div>
    <form id="sendForm" hidden>
      <input id="msgInput" maxlength="4000" placeholder="Сообщение" autocomplete="off">
      <button>Отправить</button>
    </form>
  </main>
</section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
