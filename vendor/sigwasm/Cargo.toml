[package]
name = "sigwasm"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libsignal-protocol = { path = "../libsignal/rust/protocol" }
rand = "0.9"
base64 = "0.22.1"
serde_json = "1.0.45"
futures-util = "0.3"
async-trait = "0.1.79"
uuid = "1.5"
md-5 = "0.10"
wasm-bindgen = "0.2.100"
js-sys = "0.3.77"
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true
